# Watched jobs run in their own target dir so a stray `cargo build`/`cargo clippy`
# in another terminal can't block on the build-directory lock or invalidate
# fingerprints mid-watch. --keep-going stops cargo cancelling the other target's
# lints as soon as the first one fails, so the count doesn't depend on scheduling.
default_job = "clippy-all"

[jobs.clippy-all]
command = [
    "cargo", "clippy", "--all-targets", "--keep-going",
    "--target-dir", "target/bacon",
    "--color", "always",
]
need_stdout = false

[jobs.clippy]
command = [
    "cargo", "clippy", "--keep-going",
    "--target-dir", "target/bacon",
    "--color", "always",
]
need_stdout = false
