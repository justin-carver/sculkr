[package]
name = "sculkr"
description = "Companion CLI for packwiz - generate modlists and track Minecraft modpack changes"
authors = ["justin-carver"]
version = "0.2.4"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
keywords = ["packwiz", "modpack", "minecraft", "curseforge", "modlist"]
categories = ["command-line-utilities"]
repository = "https://github.com/justin-carver/sculkr"
build = "build.rs"
# Patterns are matched gitignore-style against the packaged paths, so a leading
# "./" matches nothing. Everything here is development tooling that a crates.io
# consumer never runs.
exclude = [
  ".github/",
  ".gitattributes",
  ".gitignore",
  ".rustfmt.toml",
  "cliff.toml",
  "justfile",
  "scripts/",
  "*.png",
]

# Borrowed from the lovely: https://www.namtao.com/rust/
[lints.clippy]
# UM, ACTUALLY
pedantic = { level = "deny", priority = -1 }
# DEVELOPING LINTS
nursery = { level = "deny", priority = -1 }
# DENY PANICS
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
unreachable = "deny"
unimplemented = "deny"
unchecked_time_subtraction = "deny"
todo = "deny"
string_slice = "deny"
panic_in_result_fn = "deny"
panic = "deny"
exit = "deny"
as_conversions = "deny"

# We'll rely on cargo-release
[package.metadata.release]
allow-branch = ["main"]
publish = false
push = true
tag-name = "v{{version}}"
tag-message = "sculkr {{version}}"
pre-release-commit-message = "release v{{version}}"

# CHANGELOG.md is generated from commit history by git-cliff rather than patched
# with search-and-replace. The hook reads NEW_VERSION out of the environment.
pre-release-hook = ["scripts/changelog.sh"]

[[bin]]
name = "sculkr"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]

clap = { version = "4.6", features = ["cargo", "derive", "color"] }

minreq = { version = "3.0", features = [
  "https-rustls",
  "json-using-serde",
  "urlencoding",
] }

serde = { version = "1.0", features = ["derive"] }
serde_with = "3.23"
serde_json = "1.0"
toml = "1.1"
thiserror = "2.0"
colored = "3.1"
log = "0.4"
# The stderr feature routes log output to stderr instead of stdout, which is
# what keeps diagnostics out of a modlist or JSON piped output.
simple_logger = { version = "5.2", features = ["stderr"] }
dotenvy = "0.15"
anyhow = "1.0.104"
directories = "6.0.0"

[dev-dependencies]
insta = { version = "1.48.0", features = ["filters"] }
