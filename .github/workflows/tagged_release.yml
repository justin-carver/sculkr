name: Tagged Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

  # Manual runs build and verify everything, then publish nothing.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# build.rs rejects compile-time variable lookups, so anything
# the crate needs is read at run time and never reaches an artifact.
env:
  BINARY_NAME: sculkr
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  meta:
    name: Resolve release metadata
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      publish: ${{ steps.resolve.outputs.publish }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve version and publish mode
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          crate_version="$(sed -n 's/^version *= *"\(.*\)".*/\1/p' Cargo.toml | head -n1)"
          if [[ -z "$crate_version" ]]; then
            echo "::error file=Cargo.toml::Could not read [package] version from Cargo.toml"
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
            if [[ "$version" != "$crate_version" ]]; then
              echo "::error file=Cargo.toml::Tag ${tag} does not match Cargo.toml version ${crate_version}. Bump the manifest or retag."
              exit 1
            fi
            publish=true
          else
            tag="v${crate_version}"
            version="$crate_version"
            publish=false
          fi

          # 1.0.0-rc.1 and friends get flagged as pre-releases.
          if [[ "$version" == *-* ]]; then prerelease=true; else prerelease=false; fi

          {
            echo "version=$version"
            echo "tag=$tag"
            echo "prerelease=$prerelease"
            echo "publish=$publish"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Release metadata"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Version | \`$version\` |"
            echo "| Tag | \`$tag\` |"
            echo "| Pre-release | \`$prerelease\` |"
            echo "| Publishes a GitHub release | \`$publish\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the changelog has notes for this version
        if: steps.resolve.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail

          # Fail here rather than after the builds have run and crates.io has
          # already published, which cannot be undone.
          if ! scripts/release-notes.sh "$VERSION" >/dev/null; then
            echo "::error file=CHANGELOG.md::CHANGELOG.md has no notes under [${VERSION}]. Fix the entry, move the tag, and push again."
            exit 1
          fi

  checks:
    uses: ./.github/workflows/checks.yml

  # Every target builds on its own architecture. rustls pulls in aws-lc-sys,
  # which compiles C and assembly. Intel macOS is the exception: one Xcode SDK covers both.
  build:
    name: Build ${{ matrix.target }}
    needs: [meta, checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe

    env:
      # Env overrides rather than RUSTFLAGS, which would invalidate the cache.
      CARGO_PROFILE_RELEASE_LTO: "true"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "1"
      CARGO_PROFILE_RELEASE_STRIP: symbols

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: build-${{ matrix.target }}

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Smoke test the binary
        # Intel macOS is cross-compiled and cannot run on an arm64 runner.
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          set -euo pipefail
          "target/${{ matrix.target }}/release/${BINARY_NAME}${{ matrix.ext }}" --version

      - name: Package archive
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          EXT: ${{ matrix.ext }}
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          stem="${BINARY_NAME}-${VERSION}-${TARGET}"
          staging="dist/${stem}"
          mkdir -p "$staging"

          cp "target/${TARGET}/release/${BINARY_NAME}${EXT}" "$staging/"
          cp README.md LICENSE NOTICE "$staging/"

          cd dist
          if [[ "$TARGET" == *windows* ]]; then
            archive="${stem}.zip"
            7z a -bso0 "$archive" "$stem" >/dev/null
          else
            archive="${stem}.tar.gz"
            tar --create --gzip --file "$archive" "$stem"
          fi
          rm -rf "$stem"

          # macOS ships shasum, everyone else sha256sum.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "${archive}.sha256"
          else
            shasum -a 256 "$archive" > "${archive}.sha256"
          fi

          echo "archive=$archive" >> "$GITHUB_OUTPUT"
          echo "Built \`$archive\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ env.BINARY_NAME }}-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: [meta, build]
    if: needs.meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write # provenance attestation
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: ${{ env.BINARY_NAME }}-*
          merge-multiple: true

      - name: Collect checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          cat ./*.sha256 | sort -k2 > SHA256SUMS.txt
          rm -f ./*.sha256

          echo "### Artifacts" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat SHA256SUMS.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz, dist/*.zip

      - name: Extract release notes from CHANGELOG
        shell: bash
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail

          # Everything from this version's heading down to the next one. GitHub
          # appends its own generated commit list below whatever body we pass.
          # The metadata job already proved this section is non-empty.
          scripts/release-notes.sh "$VERSION" > release-notes.md

          {
            echo "### Release notes"
            echo ""
            cat release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ env.BINARY_NAME }} ${{ needs.meta.outputs.tag }}
          body_path: release-notes.md
          draft: false
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.prerelease == 'false' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS.txt

  publish-crate:
    name: Publish to crates.io
    needs: [meta, build, release]
    if: needs.meta.outputs.publish == 'true' && needs.meta.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}